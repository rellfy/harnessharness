[package]
name = "harnessharness"
version = "0.1.0"
edition = "2024"

[features]
default = ["langfuse"]
otel = ["dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]
langfuse = ["otel", "dep:base64"]

[dependencies]
async-trait = "0.1"
base64 = { version = "0.22", optional = true }
opentelemetry = { version = "0.32", default-features = false, features = ["trace", "internal-logs"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "trace", "internal-logs"], optional = true }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "internal-logs"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
