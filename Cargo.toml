[package]
name = "harnessharness"
version = "0.1.0"
edition = "2024"
description = "A library to build agent harnesses declaratively"
license = "Apache-2.0"
repository = "https://github.com/rellfy/harnessharness"
readme = "README.md"
exclude = [".github", "CLAUDE.md", "AGENTS.md", "CODE_STYLE_GUIDE.md"]

[features]
default = ["langfuse", "sqlite"]
otel = ["dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]
langfuse = ["otel", "dep:base64"]
sqlite = ["dep:sqlx"]

[dependencies]
async-trait = "0.1"
base64 = { version = "0.22", optional = true }
opentelemetry = { version = "0.32", default-features = false, features = ["trace", "internal-logs"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "trace", "internal-logs"], optional = true }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "internal-logs"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.27", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"], optional = true }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
