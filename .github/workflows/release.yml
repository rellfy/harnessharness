name: Release
on:
  release:
    types: [published]
env:
  CARGO_TERM_COLOR: always
jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check tag matches every crate version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          mismatched_crates="$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg version "$tag_version" '.packages[] | select(.version != $version) | .name')"
          if [ -n "$mismatched_crates" ]; then
            echo "Tag v${tag_version} does not match the version of: ${mismatched_crates}"
            exit 1
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo publish -p harnessharness-macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
      - run: cargo publish -p harnessharness
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
