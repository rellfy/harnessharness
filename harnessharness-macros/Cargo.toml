[package]
name = "harnessharness-macros"
version = "0.1.0"
edition = "2024"
description = "Procedural macros for harnessharness"
license = "Apache-2.0"
repository = "https://github.com/rellfy/harnessharness"
keywords = ["ai", "llm", "agent", "harness"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
